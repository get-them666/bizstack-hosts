{% extends "base.html" %}{% block title %}Cleaner Login | BizStack Hosts{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center bg-gradient-to-b from-slate-50 to-white">
    <div class="max-w-md w-full mx-auto px-4">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-xl shadow-slate-100 p-8">
            <div class="text-center mb-8">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-600 text-2xl font-bold">🧹</div>
                <h1 class="mt-4 text-2xl font-extrabold text-slate-900">Cleaner Portal</h1>
                <p class="mt-1 text-sm text-slate-500">Sign in with the phone number and PIN your manager gave you.</p>
            </div>

            {% if error %}
            <div class="mb-6 px-4 py-3 rounded-xl bg-red-50 text-red-600 text-sm font-medium border border-red-100">{{ error }}</div>
            {% endif %}

            <form method="post" action="/api/worker/auth/login" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
                    <input name="phone" data-phone-format required placeholder="+1 (555) 123-4567"
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">PIN</label>
                    <input name="pin" required inputmode="numeric" maxlength="4" placeholder="4-digit PIN"
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
                <button type="submit" class="w-full py-3.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition-all shadow-md shadow-indigo-100 uppercase tracking-wider">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
