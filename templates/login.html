{% extends "base.html" %}{% block title %}Customer Login | BizStack Hosts{% endblock %}

{% block content %}
<section class="relative py-16 lg:py-24 bg-white overflow-hidden">
    <div class="max-w-md mx-auto px-4 sm:px-6 relative z-10">
        <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200 border border-slate-200">
            <div class="text-center mb-8">
                <div class="w-14 h-14 mx-auto bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 text-2xl font-bold mb-4">⚡</div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Welcome back</h1>
                <p class="text-sm text-slate-600 mt-2">Sign in to manage your STR operations dashboard.</p>
            </div>

            {% if error %}
            <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-100 text-red-700 text-sm font-medium">
                {{ error }}
            </div>
            {% endif %}

            <form action="/api/auth/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com"
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
                <button type="submit" class="w-full py-4 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-xl transition-all shadow-md shadow-indigo-100 uppercase tracking-wider">
                    Sign In
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">Need a free rental analysis first?</p>
                <a href="/#analysis-form" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 mt-1 inline-block">Get My Free Rental Analysis →</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
