<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | BizStack Hosts</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif}</style></head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen"><header class="bg-white/80 backdrop-blur-md border-b border-slate-200"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"><a href="/" class="flex items-center gap-2"><span class="text-2xl">⚡</span><span class="font-bold text-xl">BizStack <span class="text-indigo-600">Hosts</span></span></a><a href="/" class="text-sm font-medium text-slate-600 hover:text-indigo-600">Back to home</a></div></header>
<main class="min-h-[calc(100vh-5rem)] flex items-center justify-center px-4 py-12"><div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-8 shadow-sm"><div class="text-center mb-8"><div class="h-14 w-14 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-indigo-600/20">⚡</div><h1 class="text-2xl font-bold mt-5">Welcome back</h1><p class="text-sm text-slate-500 mt-2">Sign in to manage your BizStack Hosts workspace.</p></div><form action="/api/auth/login" method="POST" class="space-y-5">{% if request.query_params.get("error") %}<div class="rounded-lg border border-red-200 bg-red-50 p-3 text-xs text-red-700">{{ request.query_params.get("error") }}</div>{% endif %}<div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Email address</label><input type="email" name="email" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></div><div><label class="block text-xs font-semibold text-slate-600 mb-1.5">Password</label><input type="password" name="password" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></div><button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition">Sign in</button></form></div></main></body></html>
