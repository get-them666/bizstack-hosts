<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BizStack Hosts{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
<header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <a href="/" class="flex items-center gap-2">
        <span class="text-2xl">⚡</span>
        <span class="font-bold tracking-tight text-xl">BizStack <span class="text-indigo-600">Hosts</span></span>
      </a>
      <nav class="hidden md:flex items-center gap-2 text-sm font-medium">
        <a href="/" class="px-3 py-2 text-slate-600 hover:text-indigo-600 transition">Home</a>
        <a href="/dashboard" class="px-3 py-2 {% if request.url.path == '/dashboard' %}text-indigo-600{% else %}text-slate-600{% endif %} hover:text-indigo-600 transition">Dashboard</a>
        <a href="/hosts" class="px-3 py-2 {% if request.url.path == '/hosts' %}text-indigo-600{% else %}text-slate-600{% endif %} hover:text-indigo-600 transition">Hosts</a>
        <a href="/settings" class="px-3 py-2 {% if request.url.path == '/settings' %}text-indigo-600{% else %}text-slate-600{% endif %} hover:text-indigo-600 transition">Settings</a>
      </nav>
      <div class="flex items-center gap-3">
        <span class="hidden sm:block text-xs text-slate-500">{{ user.email if user else '' }}</span>
        <form action="/api/auth/logout" method="post">
          <button class="rounded-lg bg-slate-900 px-4 py-2 text-xs font-semibold text-white hover:bg-slate-700 transition">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  {% block content %}{% endblock %}
</main>
<footer class="border-t border-slate-200 bg-white mt-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-xs text-slate-500 flex justify-between">
    <span>© BizStack Hosts</span><span>Short-term rental operations, simplified.</span>
  </div>
</footer>
</body>
</html>
